
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  width: 100%;
  height: 100%;
  background: transparent;
  overflow: hidden;
}

#patrocinador {
  position: absolute;
  top: 10px;
  right: 10px;
  width: 260px;
  height: 130px;
  object-fit: contain;
  opacity: 1;
  transition: opacity 0.6s ease;
}
</style>
</head>

<body>

<img id="patrocinador" src="patrocinador1.jpeg">

<script>
const imagens = [
  "patrocinador1.jpeg",
  "patrocinador2.jpeg"
];

let atual = 0;

const logo = document.getElementById("patrocinador");

setInterval(() => {

  logo.style.opacity = 0;

  setTimeout(() => {

    atual = (atual + 1) % imagens.length;

    logo.src = imagens[atual];

    logo.style.opacity = 1;

  }, 600);

}, 10000);
</script>

</body>
</html>
